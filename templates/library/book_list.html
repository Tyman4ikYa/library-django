{% extends "base.html" %}

{% block title %}Каталог книг{% endblock %}

{% block content %}
<h1 class="mb-4">📚 Каталог книг</h1>

{% if books %}
    <div class="row">
        {% for book in books %}
            <div class="col-md-4 mb-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">
                            <a href="{% url 'library:book_detail' book.slug %}" class="text-decoration-none">
                                {{ book.title }}
                            </a>
                        </h5>
                        <p class="card-text text-muted mb-2">
                            {{ book.author }} · {{ book.year }}
                        </p>
                        <p class="card-text fw-bold">{{ book.price }} ₽</p>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
{% else %}
    <div class="alert alert-info">Пока ничего нет.</div>
{% endif %}
{% endblock %}
