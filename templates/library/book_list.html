{% extends 'base.html' %}

{% block title %}Каталог книг{% endblock %}

{% block content %}
<h2 class="mb-4">Каталог книг</h2>

<div class="row">
    {% for book in books %}
        <div class="col-md-4 mb-3">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">{{ book.title }}</h5>
                    <h6 class="card-subtitle mb-2 text-muted">{{ book.author }}</h6>
                    <p class="card-text">{{ book.description|truncatechars:100 }}</p>
                    <p class="text-muted small">Год: {{ book.year }}</p>
                    <a href="{% url 'library:book_detail' book.slug %}" class="btn btn-primary btn-sm">Подробнее</a>
                </div>
            </div>
        </div>
    {% empty %}
        <div class="col-12">
            <div class="alert alert-info">Книг пока нет.</div>
        </div>
    {% endfor %}
</div>
{% endblock %}
