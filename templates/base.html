
{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Библиотека{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">📚 Библиотека</a>
            <div class="d-flex gap-2">
                <a href="/books/" class="btn btn-outline-light btn-sm">Книги</a>
                <a href="/authors/" class="btn btn-outline-light btn-sm">Авторы</a>
                <a href="/borrowings/" class="btn btn-outline-light btn-sm">Выдачи</a>
                <a href="/about/" class="btn btn-outline-light btn-sm">О нас</a>
            </div>
        </div>
    </nav>
    <main class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
