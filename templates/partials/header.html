<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">📚 Библиотека</a>
        <div class="ms-auto d-flex align-items-center gap-3">
            {% if user.is_authenticated %}
                <a href="{% url 'reading:detail' %}" class="btn btn-outline-light btn-sm position-relative">
                    📖 Мой список
                    {% if reading_count %}
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                            {{ reading_count }}
                        </span>
                    {% endif %}
                </a>
                <span class="text-light">Привет, <strong>{{ user.username }}</strong></span>
                <form method="post" action="{% url 'accounts:logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'accounts:login' %}" class="btn btn-outline-light btn-sm">Войти</a>
                <a href="{% url 'accounts:register' %}" class="btn btn-warning btn-sm">Регистрация</a>
            {% endif %}
        </div>
    </div>
</nav>
