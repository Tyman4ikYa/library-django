{% extends 'base.html' %}

{% block title %}Оформление выдачи{% endblock %}

{% block content %}
<h1 class="mb-4">Оформление выдачи</h1>
<div class="row">
    <div class="col-md-7">
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <div class="text-danger small">{{ error }}</div>
                    {% endfor %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-success btn-lg w-100">Оформить выдачу</button>
        </form>
    </div>
</div>
{% endblock %}
